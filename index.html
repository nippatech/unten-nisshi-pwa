<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>運転日誌</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./app.css?v=0.13.3">
</head>
<body>
<header id="topbar">
  <button id="btn-back" aria-label="戻る" hidden>‹</button>
  <h1 id="page-title">運転日誌</h1>
  <span id="who"></span>
  <span id="net-status" class="net-online" title="通信状態">●</span>
</header>

<div id="update-banner" class="update-banner" hidden>
  <span id="update-text">新しいアプリ版があります</span>
  <a id="update-dl" class="update-dl" href="#" target="_blank" rel="noopener noreferrer">ダウンロード</a>
  <button id="update-dismiss" type="button" aria-label="閉じる">×</button>
</div>

<main id="view"></main>

<nav id="bottombar">
  <button class="navbtn" data-route="#/list">一覧</button>
  <button class="navbtn" data-route="#/new">新規</button>
  <button class="navbtn admin-only" data-route="#/bulk" hidden>一括</button>
  <button class="navbtn admin-only" data-route="#/staff" hidden>社員</button>
  <button class="navbtn admin-only" data-route="#/pdf" hidden>PDF</button>
  <button class="navbtn" data-route="#/settings">設定</button>
</nav>

<!-- 各画面のテンプレート -->

<template id="tpl-config">
  <section class="card">
    <h2>初回設定</h2>
    <p class="hint">GASウェブアプリの URL と共有トークンを入れてください。社内配布の APK では事前に埋め込みます。</p>
    <label>GAS URL
      <input id="cfg-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    </label>
    <label>共有トークン
      <input id="cfg-token" type="text" placeholder="nip-unten-poc-2026-..." autocomplete="off">
    </label>
    <div class="row">
      <button id="cfg-test" class="primary">接続テスト</button>
      <button id="cfg-save" class="primary">保存</button>
    </div>
    <p id="cfg-msg" class="msg"></p>
  </section>
</template>

<template id="tpl-picker">
  <section class="card">
    <h2>あなたは誰ですか？</h2>
    <p class="hint">運転日誌に「入力者」として記録されます。あとで設定画面で変更できます。</p>
    <div id="picker-list" class="picker-list"></div>
  </section>
</template>

<template id="tpl-list">
  <section class="list-section">
    <div class="list-toolbar">
      <span id="list-count">— 件</span>
      <button id="btn-refresh" class="ghost">更新</button>
    </div>
    <div id="pending-banner" class="pending-banner" hidden>
      <span id="pending-count"></span> 件が未送信です
      <button id="btn-sync" class="ghost">送信</button>
    </div>
    <div id="list-items"></div>
    <p id="list-msg" class="msg"></p>
  </section>
</template>

<template id="tpl-form">
  <section class="card">
    <h2>新規入力</h2>
    <form id="form-new" autocomplete="off">
      <label>日時
        <input id="f-date" type="date" required>
      </label>
      <label>運転者 <small id="f-driver-hint"></small>
        <select id="f-driver" required></select>
      </label>
      <label>車種
        <select id="f-vehicle" required></select>
      </label>
      <label>発車前メータ <small id="f-start-hint"></small>
        <input id="f-start" type="number" inputmode="numeric" min="0" required>
      </label>
      <label>到着後メータ
        <input id="f-end" type="number" inputmode="numeric" min="0" required>
      </label>
      <p class="distance">走行距離: <span id="f-dist">—</span> km</p>
      <label class="check">
        <input id="f-etc" type="checkbox" checked>
        ETC を使用した
      </label>
      <label>給油（L、空欄可）
        <input id="f-fuel" type="number" inputmode="decimal" step="0.01" min="0">
      </label>
      <fieldset class="dest-fs">
        <legend>行先（複数登録可）</legend>
        <div id="f-destinations"></div>
        <button id="btn-add-dest" type="button" class="ghost small">＋ 行先を追加</button>
      </fieldset>
      <label>アルコールチェック確認者
        <input id="f-alc" type="text" list="alc-options" placeholder="名前を入力 or 選択">
        <datalist id="alc-options"></datalist>
      </label>
      <label>備考
        <textarea id="f-memo" rows="2" placeholder="連絡事項など"></textarea>
      </label>
      <button id="btn-submit" class="primary big" type="submit">登録</button>
      <p id="form-msg" class="msg"></p>
    </form>
  </section>
</template>

<template id="tpl-settings">
  <section class="card">
    <h2>設定</h2>
    <p>入力者: <strong id="set-who"></strong> <button id="btn-change-user" class="ghost">変更</button></p>
    <p>GAS URL: <code id="set-url"></code></p>
    <p>SHARED_TOKEN: <code id="set-token"></code></p>
    <hr>
    <div class="row">
      <button id="btn-edit-config" class="ghost">接続設定を編集</button>
      <button id="btn-clear-cache" class="ghost danger" hidden>ローカル全消去</button>
    </div>
    <hr>
    <p class="hint">アプリ本体（APK）の更新</p>
    <div class="row">
      <button id="btn-check-update" class="ghost" type="button">更新を確認</button>
    </div>
    <p id="update-status" class="hint"></p>
    <p class="hint">
      アプリのバージョン: <span id="ver"></span><br>
      未送信件数: <span id="set-pending">0</span>
    </p>
  </section>
</template>

<template id="tpl-staff">
  <section class="card" id="card-appsheet-import">
    <h2>AppSheet版データ取り込み（管理者専用）</h2>
    <p class="hint">並行運用中の AppSheet 版スプレッドシートから、PWA「データ」シートに重複なく追記します。判定キーは「データID」。同じIDがあればスキップします。</p>
    <div class="row" style="gap:8px; flex-wrap:wrap;">
      <button id="btn-appsheet-inspect" class="ghost" type="button">内訳を確認（書き込みなし）</button>
      <button id="btn-appsheet-import" class="primary" type="button" disabled>取り込み実行</button>
    </div>
    <pre id="appsheet-result" class="appsheet-result" hidden></pre>
    <p id="appsheet-msg" class="msg"></p>
  </section>
  <section class="card">
    <h2>社員管理（管理者専用）</h2>
    <p class="hint">運転者ドロップダウンに表示される人を管理します。退職フラグを立てると、ドロップダウンから消えます（過去の入力データは残ります）。</p>
    <div class="staff-add">
      <h3>新規追加</h3>
      <div class="staff-add-row">
        <input id="staff-new-id" type="text" placeholder="社員ID（氏名でも可）">
        <input id="staff-new-name" type="text" placeholder="表示名（氏名）">
        <button id="btn-staff-add" class="primary" type="button">追加</button>
      </div>
      <p id="staff-add-msg" class="msg"></p>
    </div>
    <hr>
    <h3>社員一覧</h3>
    <div class="staff-toolbar">
      <label class="admin-toggle"><input type="checkbox" id="chk-show-retired"> 退職者も表示</label>
      <span id="staff-count" class="bulk-rowcount">— 件</span>
    </div>
    <div id="staff-list" class="staff-list"></div>
    <p id="staff-msg" class="msg"></p>
  </section>
</template>

<template id="tpl-bulk">
  <section class="card">
    <h2>一括入力（代理・過去日付OK）</h2>
    <p class="hint">過去日付・他の運転者として複数件まとめて登録できます。<br>
    必須：日付 / 運転者 / 車種 / 発車前メータ / 到着後メータ</p>
    <div class="bulk-toolbar">
      <button id="btn-bulk-add" class="ghost" type="button">＋ 行を追加</button>
      <button id="btn-bulk-clear" class="ghost danger" type="button">全クリア</button>
      <span id="bulk-rowcount" class="bulk-rowcount">0 行</span>
    </div>
    <div class="bulk-table-wrap">
      <table class="bulk-table">
        <thead>
          <tr>
            <th>日付</th>
            <th>運転者</th>
            <th>車種</th>
            <th>発車前</th>
            <th>到着後</th>
            <th>距離</th>
            <th>ETC</th>
            <th>給油</th>
            <th>備考</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="bulk-rows"></tbody>
      </table>
    </div>
    <button id="btn-bulk-submit" class="primary big" type="button">全件送信</button>
    <div id="bulk-progress" class="bulk-progress"></div>
    <p id="bulk-msg" class="msg"></p>
  </section>
</template>

<template id="tpl-pdf">
  <section class="card">
    <h2>PDF出力（管理者専用）</h2>
    <p class="hint">AppSheet版と同じレイアウトの運転日誌PDFを作成します。作成したPDFはDriveの「PDF」フォルダにも保存されます。車種を選ばない場合は、期間内に走行のあった全車種を車種ごとに出力します。</p>
    <form id="form-pdf" autocomplete="off">
      <label>開始日
        <input id="p-start" type="date" required>
      </label>
      <label>終了日
        <input id="p-end" type="date" required>
      </label>
      <label>車種（未選択＝全車種）
        <select id="p-vehicle"><option value="">— 全車種 —</option></select>
      </label>
      <label>運転者（未選択＝全員）
        <select id="p-driver"><option value="">— 全員 —</option></select>
      </label>
      <label>印鑑（未選択＝なし）
        <select id="p-hanko"><option value="">— なし —</option></select>
      </label>
      <button id="btn-pdf" class="primary big" type="submit">PDF作成</button>
      <p id="pdf-msg" class="msg"></p>
      <div id="pdf-results"></div>
    </form>
  </section>
</template>

<script src="./app.js?v=0.13.3" defer></script>
</body>
</html>
